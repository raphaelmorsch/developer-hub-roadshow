apiVersion: v1
kind: Namespace
metadata:
  name: parasol-store-${{ values.branch }}
  labels:
    app: parasol-store
    requester: ${{ values.requester }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parasol-store
  namespace: parasol-store-${{ values.branch }}
  labels:
    app: parasol-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parasol-store
  template:
    metadata:
      labels:
        app: parasol-store
    spec:
      containers:
        - name: parasol-store
          image: quay.io/${{ values.requester }}/parasol-store:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: parasol-store
  namespace: parasol-store-${{ values.branch }}
spec:
  selector:
    app: parasol-store
  ports:
    - port: 8080
      targetPort: 8080
